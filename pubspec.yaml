name: platepatch
description: "Add one simple thing to the meal you already have."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  purchases_flutter: ^10.11.0
  image: ^4.9.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  http: ^1.6.0
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#2E6B4F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 24
  ios: true
  remove_alpha_ios: true
